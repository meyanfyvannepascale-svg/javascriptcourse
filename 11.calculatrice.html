          console.log(`n1:${n1}`);
        } else {

      let result;
      function Calculatrice(n1, n2, operator) {
        console.log(`${n1}` + `${operator}` + `${n2}`);
        if (operator === "+") {
          console.log(n1 + n2);
          result = n1 + n2;
        } else if (operator === "-") {
          console.log(n1 - n2);
          result = n1 - n2;
        } else if (operator === "*") {
          console.log(n1 * n2);
          result = n1 * n2;
        } else if (operator === "/") {
          console.log(n1 / n2);
          result = n1 / n2;
        }
        alert(result);
        operator = " "; // je vide l'operateur pour pouvoir utiliser la fonction unitTodecimal pour les prochaines operations
