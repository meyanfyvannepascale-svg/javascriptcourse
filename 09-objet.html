<!doctype html>
<html>
  <head>
    <title>Objects</title>
  </head>
  <body>
    <script>
      const product = {
        name: "socks",
        price: 1090,
      };
      console.log(product);
      console.log(product.price);

      product.name = "car";
      console.log(product);
      product.brand = "toyota";
      console.log(product);
      delete product.price;
      console.log(product);
    </script>
  </body>
</html>
