<!doctype html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
      body {
        background-color: #151617;
      }
      div {
        color: aliceblue;
      }
      p {
        color: aliceblue;
      }
      title {
        font-size: 30px;
        font-weight: bold;
      }
      .move-button {
        border-radius: 60px;
        background-color: transparent;
        border: 3px solid white;
        width: 120px;
        height: 120px;
      }
      .move-icon {
        width: 90px;
        height: 90px;
      }
      .score {
        margin-top: 50px;
      }
      .reset-score-button {
        background-color: white;
        border: none;
        font-size: 15px;
        padding: 8px 15px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>Rock paper scissors</p>
    <button
      onclick="
        let player = 'rock';
        comparaison(player);
      "
      class="move-button"
    >
      <img src="rock-emoji.png" class="move-icon" />
    </button>
    <button
      onclick="
        player = 'paper';
        comparaison(player);
      "
      class="move-button"
    >
      <img src="paper-emoji.png" class="move-icon" />
    </button>
    <button
      onclick="
        player = 'scissors';
        comparaison(player);
      "
      class="move-button"
    >
      <img src="scissors-emoji.png" class="move-icon" />
    </button>
    <div class="js-computerMove"></div>
    <div class="js-result"></div>
    <div class="js-score"></div>

    <script>
      let result = JSON.parse(localStorage.getItem("result"));
      let score = JSON.parse(localStorage.getItem("score")) || {
        win: 0,
        lose: 0,
        equality: 0,
      };
      /* document.querySelector(".js-result").innerHTML =
        `you played ${player},computer played ${computerMove}, result is ${result}`;*/

      function pickcomputerMove() {
        let computerMove = "";
        let randomNumber;

        console.log(" L'ordinateur joue");
        randomNumber = Math.random();
        if (randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber <= 2 / 3) {
          computerMove = "scissors";
        } else if (randomNumber > 2 / 3) {
          computerMove = "paper";
        }
        console.log(computerMove);
        return computerMove;
      }
      function comparaison(player) {
        const computerMove = pickcomputerMove();

        if (player === "scissors") {
          if (computerMove === "paper") {
            result = "you win";
          } else if (computerMove === "rock") {
            result = "computer win";
          }
        }
        if (player === "paper") {
          if (computerMove === "scissors") {
            result = "computer win";
          } else if (computerMove === "rock") {
            result = "you win";
          }
        }
        if (player === "rock") {
          if (computerMove === "paper") {
            result = "computer win";
          } else if (computerMove === "scissors") {
            result = "you win";
          }
        }
        if (player === computerMove) {
          result = "equality";
        }
        localStorage.setItem("result", JSON.stringify(result));

        if (result === "you win") {
          score.win++;
        }
        if (result === "computer win") {
          score.lose++;
        }
        if (result === "equality") {
          score.equality++;
        }

        localStorage.setItem("score", JSON.stringify(score));

        /*alert(
          `you played ${player},computer played ${computerMove}, result is ${result} \n win:${score.win},lose: ${score.lose},equality: ${score.equality}`,
        );*/
        return result;
      }
      document.querySelector(".js-result").innerHTML = result;
      document.querySelector(".js-score").innerHTML =
        `Wins:${score.win},Loses:${score.lose},Equality:${score.equality}`;
      document.querySelector(".js-computerMove").innerHTML =
        `computer played ${computerMove}`;
    </script>
    <button
      onclick="
        score.win = 0;
        score.lose = 0;
        score.equality = 0;
        localStorage.removeItem('score');
        document.querySelector('.js-score').innerHTML =
          `Wins:${score.win},Loses:${score.lose},Equality:${score.equality}`;
      "
      class="reset-score-button"
    >
      Reset score
    </button>
  </body>
</html>
