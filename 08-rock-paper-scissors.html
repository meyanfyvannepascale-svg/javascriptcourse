<!doctype html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock paper scissors</p>
    <button
      onclick="
        let player = 'rock';
        comparaison(player);
      "
    >
      rock
    </button>
    <button
      onclick="
        player = 'paper';
        comparaison(player);
      "
    >
      paper
    </button>
    <button
      onclick="
        player = 'scissors';
        comparaison(player);
      "
    >
      scissors
    </button>
    <script>
      let result = "";
      const score = {
        win: 0,
        lose: 0,
        equality: 0,
      };
      function pickcomputerMove() {
        let computerMove = "";
        let randomNumber;

        console.log(" L'ordinateur joue");
        randomNumber = Math.random();
        if (randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber <= 2 / 3) {
          computerMove = "scissors";
        } else if (randomNumber > 2 / 3) {
          computerMove = "paper";
        }
        console.log(computerMove);
        return computerMove;
      }
      function comparaison(player) {
        const computerMove = pickcomputerMove();

        if (player === "scissors") {
          if (computerMove === "paper") {
            result = "you win";
          } else if (computerMove === "rock") {
            result = "computer win";
          }
        }
        if (player === "paper") {
          if (computerMove === "scissors") {
            result = "computer win";
          } else if (computerMove === "rock") {
            result = "you win";
          }
        }
        if (player === "rock") {
          if (computerMove === "paper") {
            result = "computer win";
          } else if (computerMove === "scissors") {
            result = "you win";
          }
        }
        if (player === computerMove) {
          result = "equality";
        }
        if (result === "you win") {
          score.win++;
        }
        if (result === "computer win") {
          score.lose++;
        }
        if (result === "equality") {
          score.equality++;
        }
        alert(
          `you played ${player},computer played ${computerMove}, result is ${result} \n win:${score.win},lose: ${score.lose},equality: ${score.equality}`,
        );
        return result;
      }
    </script>
    <button
      onclick="
        score.win = 0;
        score.lose = 0;
        score.equality = 0;
      "
    >
      Reset score
    </button>
  </body>
</html>
