<!doctype html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <p>Rock paper scissors</p>
    <button
      onclick="
        let player = 'rock';
        comparaison(player);
      "
    >
      rock
    </button>
    <button
      onclick="
        player = 'paper';
        comparaison(player);
      "
    >
      paper
    </button>
    <button
      onclick="
        player = 'scissors';
        comparaison(player);
      "
    >
      scissors
    </button>
    <p class="js-computerMove"></p>
    <p class="js-result"></p>
    <p class="js-score"></p>

    <script>
      let result = JSON.parse(localStorage.getItem("result"));
      let score = JSON.parse(localStorage.getItem("score")) || {
        win: 0,
        lose: 0,
        equality: 0,
      };
      /* document.querySelector(".js-result").innerHTML =
        `you played ${player},computer played ${computerMove}, result is ${result}`;*/

      function pickcomputerMove() {
        let computerMove = "";
        let randomNumber;

        console.log(" L'ordinateur joue");
        randomNumber = Math.random();
        if (randomNumber < 1 / 3) {
          computerMove = "rock";
        } else if (randomNumber >= 1 / 3 && randomNumber <= 2 / 3) {
          computerMove = "scissors";
        } else if (randomNumber > 2 / 3) {
          computerMove = "paper";
        }
        console.log(computerMove);
        return computerMove;
      }
      function comparaison(player) {
        const computerMove = pickcomputerMove();

        if (player === "scissors") {
          if (computerMove === "paper") {
            result = "you win";
          } else if (computerMove === "rock") {
            result = "computer win";
          }
        }
        if (player === "paper") {
          if (computerMove === "scissors") {
            result = "computer win";
          } else if (computerMove === "rock") {
            result = "you win";
          }
        }
        if (player === "rock") {
          if (computerMove === "paper") {
            result = "computer win";
          } else if (computerMove === "scissors") {
            result = "you win";
          }
        }
        if (player === computerMove) {
          result = "equality";
        }
        localStorage.setItem("result", JSON.stringify(result));

        if (result === "you win") {
          score.win++;
        }
        if (result === "computer win") {
          score.lose++;
        }
        if (result === "equality") {
          score.equality++;
        }

        localStorage.setItem("score", JSON.stringify(score));

        document.querySelector(".js-result").innerHTML = result;
        document.querySelector(".js-score").innerHTML =
          `Wins:${score.win},Loses:${score.lose},Equality:${score.equality}`;
        document.querySelector(".js-computerMove").innerHTML =
          `computer played ${computerMove}`;
        /*alert(
          `you played ${player},computer played ${computerMove}, result is ${result} \n win:${score.win},lose: ${score.lose},equality: ${score.equality}`,
        );*/
        return result;
      }
    </script>
    <button
      onclick="
        score.win = 0;
        score.lose = 0;
        score.equality = 0;
        localStorage.removeItem('score');
        document.querySelector('.js-score').innerHTML =
          `Wins:${score.win},Loses:${score.lose},Equality:${score.equality}`;
      "
    >
      Reset score
    </button>
  </body>
</html>
