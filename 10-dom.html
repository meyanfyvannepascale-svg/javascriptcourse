<!doctype html>
<html>
  <head>
    <title>DOM</title>
    <style>
      p {
        color: rgb(31, 2, 58);
      }
      .subscribe-button {
        border: none;
        background-color: rgb(46, 223, 164);
        color: rgb(6, 5, 60);
        padding-top: 10px;
        padding-left: 14px;
        padding-right: 14px;
        padding-bottom: 10px;
        font-weight: bold;
        border-radius: 50px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>YouTube Subscribe Button</p>
    <button onclick="Subscribe()" class="js-subscribe-button">Subscribe</button>
    <p>Amazon Shipping Calculator</p>
    <p>price > $40 => +$10 shipping</p>
    <p>price < $40 => Free shipping</p>
    <input
      placeholder="prix de la commande"
      class="js-cost-input"
      onkeydown="
        console.log('typing');
        console.log(event.key);
      "
    />
    <button onclick="calculateTotal()">Calculate</button>
    <p class="js-total-cost"></p>
    <script>
      function calculateTotal() {
        var inputElement = document.querySelector(".js-cost-input");
        let cost = Number(inputElement.value);
        if (cost < 40) {
          cost = cost + 10;
          console.log(cost);
        }
        document.querySelector(".js-total-cost").innerHTML =
          `le cout total:$${cost}`;
      }
      function Subscribe() {
        const buttonElement = document.querySelector(".js-subscribe-button");
        if (buttonElement.innerText === "Subscribe") {
          buttonElement.innerHTML = "Subscribed";
        } else {
          buttonElement.innerHTML = "subscribe";
        }
      }
      //const buttonElement= import 08-rock-paper-scissors from "./08-rock-paper-scissors";
    </script>
  </body>
</html>
